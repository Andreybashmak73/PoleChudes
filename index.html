<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Откуда цель?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --khaki: #6b7344;
      --khaki-dark: #3d4226;
      --olive: #2c3118;
      --sand: #c4b48a;
      --sand-light: #ddd0a8;
      --ink: #1a1c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--olive); color: var(--sand-light);
      font-family: Oswald, system-ui, sans-serif;
    }
    body {
      background-color: #2a2e18;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(140, 150, 80, .18), transparent 40%),
        radial-gradient(ellipse at 80% 90%, rgba(0,0,0,.45), transparent 50%),
        repeating-linear-gradient(0deg, transparent 0 17px, rgba(0,0,0,.08) 17px 18px),
        linear-gradient(180deg, #4a5130 0%, #2a2e18 45%, #1b1e10 100%);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22; z-index: 1;
      background-image:
        radial-gradient(circle at 12% 22%, #5c6434 0 18px, transparent 19px),
        radial-gradient(circle at 38% 68%, #3a401f 0 28px, transparent 29px),
        radial-gradient(circle at 72% 18%, #6e7648 0 22px, transparent 23px),
        radial-gradient(circle at 86% 74%, #2f3418 0 34px, transparent 35px),
        radial-gradient(circle at 54% 44%, #50572c 0 16px, transparent 17px);
    }
    .screen {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      z-index: 3; padding: 24px;
    }
    .screen.active { display: flex; flex-direction: column; }
    .sign {
      position: relative; width: min(720px, 92vw);
      padding: 34px 26px 30px; text-align: center;
      background: linear-gradient(180deg, #5d6640 0%, #3f452b 100%);
      border: 8px solid #8a8358; outline: 3px solid #2a2c18;
      box-shadow: 0 0 0 10px #4a4e32, 0 22px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.28);
    }
    .sign::before {
      content: "СЕКРЕТНО"; position: absolute; top: 10px; right: 14px;
      font-size: 11px; letter-spacing: .22em; color: #9a2b2b;
      border: 1px solid #9a2b2b; padding: 2px 6px;
    }
    .corners span { position: absolute; width: 16px; height: 16px; border: 3px solid #c2b57a; }
    .corners .tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
    .corners .tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
    .corners .bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; }
    .corners .br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
    .eyebrow {
      font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
      color: #d7cb96; margin-bottom: 8px;
    }
    .title {
      font-family: "Black Ops One", "Russo One", sans-serif;
      font-size: clamp(34px, 7vw, 72px); line-height: .95;
      margin: 6px 0 16px; color: #efe6c2; text-transform: uppercase;
      text-shadow: 0 3px 0 #2a2c16, 0 10px 18px rgba(0,0,0,.35);
    }
    .subtitle { opacity: .85; margin-bottom: 24px; font-size: 16px; }
    .btn {
      appearance: none; border: 2px solid #d7cb96;
      background: linear-gradient(180deg, #6f7848, #3e4428);
      color: #efe6c2; font-family: "Black Ops One", Oswald, sans-serif;
      font-size: 18px; letter-spacing: .12em; text-transform: uppercase;
      padding: 14px 36px; cursor: pointer;
      box-shadow: 0 6px 0 #1f2212, 0 12px 18px rgba(0,0,0,.3);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f2212; }
    .btn.ghost {
      background: transparent; color: #d7cb96; box-shadow: none;
      border-color: rgba(215,203,150,.55); font-family: Oswald, sans-serif;
      font-size: 15px; padding: 10px 18px;
    }
    #game { gap: 16px; }
    .game-head { text-align: center; }
    .game-head h2 {
      font-family: "Black Ops One", sans-serif;
      font-size: clamp(26px, 5vw, 44px); color: #efe6c2;
      text-transform: uppercase; text-shadow: 0 3px 0 #1f2212;
    }
    .game-head p {
      opacity: .75; margin-top: 4px; letter-spacing: .12em;
      text-transform: uppercase; font-size: 13px;
    }
    .wheel-wrap {
      position: relative; width: min(78vmin, 560px); height: min(78vmin, 560px);
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.5));
    }
    .pointer {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      z-index: 5; width: 0; height: 0;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-top: 36px solid #ffd24a;
    }
    .pointer::after {
      content: ""; position: absolute; top: -42px; left: -8px;
      width: 16px; height: 16px; background: #fff1b0;
      border: 3px solid #8a5a10; border-radius: 50%;
    }
    .wheel-frame {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, transparent 67%, #7a5314 67.2%, #f1d37a 71%, #8a5d16 75%, #3a2408 100%);
      box-shadow: inset 0 0 0 10px #2a1604;
    }
    #wheel {
      position: absolute; inset: 8.5%; border-radius: 50%;
      overflow: hidden; background: #111;
    }
    .sector-label {
      position: absolute; width: 28%; transform: translate(-50%, -50%);
      font-family: "Russo One", sans-serif;
      font-size: clamp(22px, 5.2vmin, 40px); line-height: 1;
      text-align: center; pointer-events: none;
      text-shadow: 0 2px 0 rgba(0,0,0,.35); white-space: nowrap;
    }
    .sector-label.long {
      white-space: normal; width: 30%;
      font-size: clamp(13px, 2.8vmin, 20px); line-height: 1.15;
    }
    .hub {
      position: absolute; left: 50%; top: 50%; width: 22%; height: 22%;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff2b8, #d7a32a 45%, #6d470c);
      border: 5px solid #3d2408; z-index: 4;
    }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; z-index: 4; }
    .result {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(12, 14, 8, .62); z-index: 10; padding: 20px;
    }
    .result.show { display: flex; }
    .result-card {
      width: min(480px, 92vw);
      background: linear-gradient(180deg, #4e5534, #2a2e18);
      border: 6px solid #c2b57a; padding: 28px 22px; text-align: center;
    }
    .result-card small { color: #d7cb96; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; }
    .result-card h3 {
      font-family: "Black Ops One", sans-serif;
      font-size: clamp(26px, 6vw, 42px); margin: 10px 0 18px; color: #efe6c2;
    }
    .hint { font-size: 13px; opacity: .65; text-align: center; }
    audio { display: none; }
  </style>
</head>
<body>
  <section id="start" class="screen active">
    <div class="sign" id="sign">
      <div class="corners">
        <span class="tl"></span><span class="tr"></span>
        <span class="bl"></span><span class="br"></span>
      </div>
      <div class="eyebrow">Полевая сводка / барабан судьбы</div>
      <h1 class="title">Откуда цель?</h1>
      <p class="subtitle">Крутите барабан. Координаты выдаст сам.</p>
      <button class="btn" id="startBtn">Начать</button>
    </div>
  </section>
  <section id="game" class="screen">
    <div class="game-head">
      <h2>Откуда цель?</h2>
      <p>Жмите на барабан или на кнопку</p>
    </div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel-frame"></div>
      <div id="wheel"></div>
      <div class="hub"></div>
    </div>
    <div class="controls">
      <button class="btn" id="spinBtn">Крутить барабан</button>
      <button class="btn ghost" id="muteBtn">Музыка: вкл</button>
    </div>
    <p class="hint">Если музыки нет — положите файл Pole.mp3 рядом с index.html</p>
  </section>
  <div class="result" id="result">
    <div class="result-card">
      <small>Барабан остановился на</small>
      <h3 id="resultText">—</h3>
      <button class="btn" id="againBtn">Ещё раз</button>
    </div>
  </div>
  <audio id="bgm" src="Pole.mp3" loop preload="auto"></audio>
  <script>
    const SECTORS = ["90","385","61","120","39","155","268","1444","Сами нашли","Да я хуй знает","Я увольняюсь"];
    const COLORS = ["#111111", "#f3ead4"];
    const TEXT = ["#f6edd6", "#161616"];
    const wheel = document.getElementById("wheel");
    const startScreen = document.getElementById("start");
    const gameScreen = document.getElementById("game");
    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const bgm = document.getElementById("bgm");
    const muteBtn = document.getElementById("muteBtn");
    const slice = 360 / SECTORS.length;
    let rotation = 0, spinning = false, muted = false;
    function buildWheel() {
      const stops = SECTORS.map((_, i) => COLORS[i % 2] + " " + (i * slice).toFixed(3) + "deg " + ((i + 1) * slice).toFixed(3) + "deg").join(", ");
      wheel.style.background = "conic-gradient(from " + (-slice / 2) + "deg, " + stops + ")";
      SECTORS.forEach((label, i) => {
        const el = document.createElement("div");
        el.className = "sector-label" + (label.length > 6 ? " long" : "");
        el.textContent = label;
        const angle = (i * slice - 90) * Math.PI / 180;
        const radius = 34;
        el.style.left = "calc(50% + " + (Math.cos(angle) * radius) + "%)";
        el.style.top = "calc(50% + " + (Math.sin(angle) * radius) + "%)";
        el.style.color = TEXT[i % 2];
        wheel.appendChild(el);
      });
    }
    function playMusic() {
      bgm.volume = 0.55;
      const p = bgm.play();
      if (p && p.catch) p.catch(function(){});
    }
    function sectorAtPointer() {
      const norm = ((rotation % 360) + 360) % 360;
      const deg = (360 - norm) % 360;
      return Math.floor((deg + slice / 2) / slice) % SECTORS.length;
    }
    function spin() {
      if (spinning) return;
      spinning = true;
      result.classList.remove("show");
      const extra = 4 + Math.floor(Math.random() * 4);
      const targetIndex = Math.floor(Math.random() * SECTORS.length);
      const jitter = (Math.random() - 0.5) * (slice * 0.7);
      const current = ((rotation % 360) + 360) % 360;
      const desired = (360 - targetIndex * slice) % 360;
      let delta = desired - current + jitter;
      if (delta < 0) delta += 360;
      const final = rotation + extra * 360 + delta;
      const start = rotation, change = final - start;
      const duration = 4200 + Math.random() * 1200, t0 = performance.now();
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function frame(now) {
        const t = Math.min(1, (now - t0) / duration);
        rotation = start + change * easeOut(t);
        wheel.style.transform = "rotate(" + rotation + "deg)";
        if (t < 1) requestAnimationFrame(frame);
        else {
          spinning = false;
          resultText.textContent = SECTORS[sectorAtPointer()];
          result.classList.add("show");
        }
      }
      requestAnimationFrame(frame);
    }
    document.getElementById("startBtn").addEventListener("click", function() {
      startScreen.classList.remove("active");
      gameScreen.classList.add("active");
      playMusic();
    });
    document.getElementById("spinBtn").addEventListener("click", spin);
    wheel.addEventListener("click", spin);
    document.querySelector(".hub").addEventListener("click", spin);
    document.getElementById("againBtn").addEventListener("click", function() { result.classList.remove("show"); });
    muteBtn.addEventListener("click", function() {
      muted = !muted;
      bgm.muted = muted;
      muteBtn.textContent = muted ? "Музыка: выкл" : "Музыка: вкл";
      if (!muted) playMusic();
    });
    buildWheel();
  </script>
</body>
</html>
